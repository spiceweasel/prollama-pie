[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prollama-pie"
version = "0.1.0"
description = "Container-free multi-instance llama-server supervisor with nginx TLS gateway"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["aiohttp>=3.9,<4", "psutil>=5.9,<8"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
prollama = "prollama.cli:main"
prollama-daemon = "prollama.daemon:main"
prollama-nginx-apply = "prollama.nginx_apply:main"

[tool.setuptools.packages.find]
include = ["prollama*"]

[tool.setuptools.package-data]
prollama = ["static/*"]
